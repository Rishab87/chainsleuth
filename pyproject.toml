[project]
name = "chainsleuth"
version = "0.1.0"
description = "Illicit Bitcoin transaction detection with graph mining, GNNs and drift-aware learning (Elliptic dataset)"
readme = "README.md"
authors = [
    { name = "Rishab87", email = "kumarjharishab@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlxtend>=0.25.0",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "python-louvain>=0.16",
    "pyvis>=0.3.2",
    "river>=0.27.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "torch-geometric>=2.8.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
